modules:
  jira:backlogAction:
    - key: backlog-swipe-triage-action
      resource: main
      resolver:
        function: resolver
      viewportSize: medium
      title: Log Juggler

  jira:projectPage:
    - key: log-juggler-project-page
      resource: main
      resolver: { function: resolver }
      viewportSize: large
      title: Log Juggler
      layout: blank

  jira:globalPage:
    - key: log-juggler-global
      resource: main
      resolver: { function: resolver }
      viewportSize: large
      title: Log Juggler
      layout: blank

  function:
    - key: resolver
      handler: presentation/index.handler

resources:
  - key: main
    path: frontend/build
    tunnel:
      port: 1234

app:
  id: ari:cloud:ecosystem::app/b8d8a131-503a-444c-85d2-280a481a04c2
  runtime:
    name: nodejs20.x

permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - read:jira-user
    - manage:jira-project
    - manage:jira-configuration
    - storage:app
    - read:board-scope:jira-software
    - read:issue-details:jira
  content:
    scripts:
      - unsafe-inline
    styles:
      - unsafe-inline

# external:
#   # NOTE: for API keys, use forge variables set, read using process.env.PERPLEXITY_API_KEY

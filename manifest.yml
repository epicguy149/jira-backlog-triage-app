modules:
  jira:backlogAction:
    - key: backlog-swipe-triage-action
      resource: main
      resolver:
        function: resolver
      viewportSize: medium
      title: Log Juggler

  jira:projectPage:
    - key: log-juggler-project-page
      resource: main
      resolver: { function: resolver }
      viewportSize: large
      title: Log Juggler
      icon: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg

  jira:globalPage:
    - key: log-juggler-global
      title: Log Juggler
      icon: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg
      resource: main
      resolver: { function: resolver }
      route: /log-juggler

  jira:issuePanel:
    - key: log-juggler-issue-panel
      title: Log Juggler
      icon: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg
      resource: main
      resolver: { function: resolver }
      viewportSize: medium

  function:
    - key: resolver
      handler: index.handler

resources:
  - key: main
    path: static/hello-world/build

app:
  id: ari:cloud:ecosystem::app/300741ed-fee5-4761-8236-724da190eac0
  runtime:
    name: nodejs20.x

permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - read:jira-user
    - read:project:jira
    - read:issue:jira-software
    - write:issue:jira-software
    - read:issue-details:jira
    - read:sprint:jira-software
    - write:sprint:jira-software
    - read:board-scope:jira-software
    - write:board-scope:jira-software

  external:
    fetch:
      backend:
        - https://api.perplexity.ai

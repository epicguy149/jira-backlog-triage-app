modules:
  jira:backlogAction:
    - key: log-juggler-backlog-action
      resource: main
      resolver: { function: resolver }
      viewportSize: large
      title: Log Juggler
      icon: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg

  jira:projectPage:
    - key: log-juggler-project-page
      resource: main
      resolver: { function: resolver }
      viewportSize: large
      title: Log Juggler
      icon: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg

  jira:globalPage:
    - key: log-juggler-global
      title: Log Juggler
      icon: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg
      resource: main
      resolver: { function: resolver }
      route: /log-juggler
  jira:issuePanel:
    - key: log-juggler-issue-panel
      title: Log Juggler
      icon: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg
      resource: main
      resolver:
        function: resolver
      viewportSize: medium

  function:
    - key: resolver
      handler: index.handler

resources:
  - key: main
    path: static/hello-world/build

app:
  id: ari:cloud:ecosystem::app/300741ed-fee5-4761-8236-724da190eac0
  runtime:
    name: nodejs22.x
    memoryMB: 256

permissions:
  scopes:
    - read:jira-work
    - read:jira-user
    - read:project:jira
    - manage:jira-project
